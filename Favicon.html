<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Favicon System</title>
    <link rel="stylesheet" href="./css/style.css">
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <link id="dynamic-favicon" rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

    <div class="control-card">
        <h1>Favicon Controller</h1>
        <p>Look closely at your browser tab and click the buttons below to see the favicon update dynamically.</p>
        
        <div class="button-group">
            <button id="btn-alert" class="btn alert">Add Notification Dot</button>
            <button id="btn-clear" class="btn clear">Clear Notification</button>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
